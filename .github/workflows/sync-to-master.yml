name: Auto PR from Develop to Master

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - develop

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for existing develop to master PR
        id: check-master-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --head develop --base master --state open --json number --jq length)
          echo "existing_pr_count=$EXISTING_PR" >> $GITHUB_OUTPUT

      - name: Create labels if they don't exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "automated pr" --color "#0E8A16" --description "PR created by GitHub Actions" || true
          gh label create "sync to master" --color "#FFA500" --description "PR to sync develop with master" || true

      - name: Create PR to master
        if: steps.check-master-pr.outputs.existing_pr_count == 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base master \
            --head develop \
            --title "chore: sync develop to master" \
            --body "Automated PR to sync develop branch with master branch" \
            --label "automated pr" --label "sync to master"
